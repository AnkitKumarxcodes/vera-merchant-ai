[project]
name = "magicpin-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AnkitKumarxcodes", email = "ankitsingh17082003@gmail.com" }
]
requires-python = ">=3.12"
